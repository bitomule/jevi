[package]
name = "jevi"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Ask typed questions about a text and branch on the answer. A shell front end for TypeSafe's Jev."
repository = "https://github.com/bitomule/jevi"
homepage = "https://github.com/bitomule/jevi"
readme = "README.md"
keywords = ["jev", "typesafe", "classifier", "cli", "hooks"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/questions/examples"]

[lib]
name = "jevi"
path = "src/lib.rs"

[[bin]]
name = "jevi"
path = "src/main.rs"

[features]
default = []
# Trust the operating system's certificate store instead of the roots compiled in. Only
# needed behind a TLS-inspecting proxy that signs with a private CA — a corporate network,
# typically. It is off by default because it is expensive in a way that is invisible from
# the Cargo.toml: it pulls the certificate stores of three operating systems AND the Android
# JNI bindings, 53 packages against 47. For a tool that talks to one public endpoint, the
# bundled roots are the right trade.
system-roots = ["ureq/platform-verifier"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` is not a nicety, it is the difference between forwarding a question and
# rewriting it. Without it every object jevi parses becomes a BTreeMap and comes out
# alphabetically sorted, so a question written `{goal, context, rules}` reaches the model as
# `{context, goal, rules}` and an option written `{role, name, id}` as `{id, name, role}`.
# Measured on one recorded cell of mav's ablation bench, same words, same options, same
# state, 30 runs each: 28/30 correct in the order the caller wrote it, 3/30 sorted. The
# source used to claim the question "travels to the API untouched"; the values did, the
# order did not, and the order was worth 25 of 30.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
