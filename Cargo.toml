[package]
name = "jevi"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Ask typed questions about a text and branch on the answer. A shell front end for TypeSafe's Jev."
repository = "https://github.com/bitomule/jevi"
homepage = "https://github.com/bitomule/jevi"
readme = "README.md"
keywords = ["jev", "typesafe", "classifier", "cli", "hooks"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/.github", "/questions/examples"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
