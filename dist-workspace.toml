[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.27.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "bitomule/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Which actions to run on pull requests
pr-run-mode = "plan"

[dist.github-custom-runners]
# dist 0.27 still generates `runs-on: ubuntu-20.04` for its own plan/publish jobs, and
# GitHub has retired that image. A workflow asking for a label that no longer exists does
# not fail — it sits QUEUED forever, which is why three Release runs never started and
# looked like a GitHub backlog rather than our configuration.
global = "ubuntu-latest"
aarch64-apple-darwin = "macos-14"
x86_64-apple-darwin = "macos-14"
aarch64-unknown-linux-gnu = "ubuntu-latest"
x86_64-unknown-linux-gnu = "ubuntu-latest"
